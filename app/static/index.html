<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>монитор</title>
<style>
body{font:15px system-ui,sans-serif;margin:0;background:#f4f6f8;color:#1c2733}
header,section{background:#fff;border:1px solid #dde3ea;border-radius:8px;margin:12px auto;padding:12px 16px;max-width:1000px}
h1,h2{margin:0 0 8px;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.card{border:1px solid #dde3ea;border-radius:8px;padding:10px}
.row{display:flex;justify-content:space-between;margin:6px 0}
.badge{padding:2px 10px;border-radius:12px;font-size:13px;font-weight:600;background:#e9edf1}
.ok{background:#e3f4e9;color:#17803d}.warn{background:#fff3cd;color:#9a6700}.err{background:#fde7e5;color:#b42318}
canvas{width:100%;height:110px;display:block;border:1px solid #dde3ea;border-radius:6px}
button{font:inherit;padding:6px 12px;margin:6px 6px 0 0;border:1px solid #bbc5d0;border-radius:6px;background:#fff;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:4px 6px;border-bottom:1px solid #eee}
.small{font-size:13px;color:#5d6b7a}.error{color:#b42318}
</style>
</head>
<body>
<header>
  <h1>статус модулей</h1>
  <span class="badge" id="srv">Orange Pi</span> <span class="badge" id="rodos">RODOS</span> <span class="badge" id="sa6">SA6</span>
  <div class="error" id="errors"></div>
</header>

<section>
  <h2>Каналы</h2>
  <div class="grid" id="channels"></div>
  <button onclick="relay('all','on')">Включить все</button>
  <button onclick="relay('all','off')">Выключить все</button>
</section>

<section>
  <h2>Калибровка</h2>
  <button id="cal" onclick="calibrate()">Запустить калибровку</button>
  <button onclick="resetPreset()">Сбросить пресет</button>
  <span class="small" id="calstatus"></span>
  <div id="preset"></div>
  <canvas id="calplot" style="height:200px"></canvas>
</section>

<section>
  <h2>Журнал</h2>
  <table><tbody id="log"></tbody></table>
</section>

<script>
const $ = id => document.getElementById(id);
const RELAY = {true: ["ВКЛ", "ok"], false: ["ВЫКЛ", ""], null: ["неизвестно / нет связи", "warn"]};
const SIGNAL = {detected: ["обнаружен", "ok"], not_detected: ["не обнаружен", ""], error: ["ошибка измерения", "err"],
                unknown: ["нет данных", "warn"]};
let lastCalState = null;

async function api(path, method) {
  const r = await fetch(path, {method: method || "GET"});
  return {ok: r.ok, data: await r.json().catch(() => ({}))};
}

// Простой график: линия + подписи мин/макс по оси Y и краёв по оси X. marks - частоты, которые отметить пунктиром
function plot(canvas, startHz, stepHz, ys, marks) {
  canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight;
  const g = canvas.getContext("2d"), w = canvas.width, h = canvas.height;
  g.clearRect(0, 0, w, h);
  if (!ys || ys.length < 2) { g.fillText("нет данных", 8, 16); return; }
  const lo = Math.min(...ys) - 3, hi = Math.max(...ys) + 3, L = 38, B = 16;
  const x = i => L + (w - L - 4) * i / (ys.length - 1), y = v => 4 + (h - B - 4) * (1 - (v - lo) / (hi - lo));
  g.fillStyle = "#5d6b7a"; g.font = "11px sans-serif";
  g.fillText(hi.toFixed(0), 2, 12); g.fillText(lo.toFixed(0), 2, h - B);
  g.fillText((startHz / 1e6).toFixed(1), L, h - 3);
  g.textAlign = "right"; g.fillText(((startHz + stepHz * (ys.length - 1)) / 1e6).toFixed(1) + " МГц", w - 4, h - 3);
  g.textAlign = "left";
  g.strokeStyle = "#d29922"; g.setLineDash([4, 3]);
  (marks || []).forEach(f => { const i = (f - startHz) / stepHz; g.beginPath(); g.moveTo(x(i), 0); g.lineTo(x(i), h - B); g.stroke(); });
  g.setLineDash([]); g.strokeStyle = "#1f5fae"; g.beginPath();
  ys.forEach((v, i) => i ? g.lineTo(x(i), y(v)) : g.moveTo(x(i), y(v))); g.stroke();
}

function badge(el, [text, cls]) { el.textContent = text; el.className = "badge " + cls; }

function buildChannels() {
  for (let ch = 1; ch <= 3; ch++) {
    $("channels").insertAdjacentHTML("beforeend", `<div class="card" id="ch${ch}"><b>Канал ${ch}</b>
      <div class="row">Реле <span class="badge" data-k="relay"></span></div>
      <div class="row">Сигнал <span class="badge" data-k="signal"></span></div>
      <div class="small" data-k="info">&nbsp;</div><canvas data-k="plot"></canvas>
      <button onclick="relay(${ch},'on')">Включить</button><button onclick="relay(${ch},'off')">Выключить</button></div>`);
  }
}

async function refresh() {
  let s;
  try { s = (await api("/api/status")).data; badge($("srv"), ["Orange Pi: на связи", "ok"]); }
  catch (e) { badge($("srv"), ["Orange Pi: нет связи", "err"]); return; }

  badge($("rodos"), s.rodos.connected ? ["RODOS: на связи", "ok"] : ["RODOS: нет связи", "err"]);
  badge($("sa6"), s.sa6.error ? ["SA6: нет связи", "err"] : s.sa6.connected ? ["SA6: на связи", "ok"] : ["SA6: нет данных", "warn"]);
  $("errors").textContent = [!s.rodos.connected && "RODOS недоступен", s.sa6.error && "SA6: " + s.sa6.error].filter(Boolean).join(" · ");

  // каналы сопоставляются с найденными пиками по возрастанию частоты (как реле 1 < 2 < 3 в ТЗ)
  const signals = s.signals.slice().sort((a, b) => a.freq_hz - b.freq_hz);
  for (let ch = 1; ch <= 3; ch++) {
    const card = $("ch" + ch), q = k => card.querySelector(`[data-k=${k}]`), sig = signals[ch - 1];
    badge(q("relay"), RELAY[s.rodos.relays[ch]]);
    badge(q("signal"), s.paused ? ["калибровка…", "warn"] : SIGNAL[sig ? sig.status : "unknown"]);
    q("info").textContent = sig && sig.level_dbm !== undefined
      ? `${sig.level_dbm} дБм, +${sig.excess_db} дБ над фоном${sig.need_db ? "" : ""}, пресет ${(sig.freq_hz / 1e6).toFixed(2)} МГц` : " ";
    sig && sig.amps && sig.status !== "error" ? plot(q("plot"), sig.start_hz, sig.step_hz, sig.amps, [sig.freq_hz]) : plot(q("plot"));
  }

  const c = s.calibration;
  $("cal").disabled = c.state === "running";
  $("calstatus").textContent = {running: "идёт калибровка… ", done: "калибровка завершена", error: "ошибка: " + c.error, idle: ""}[c.state];
  if (c.state !== lastCalState) { lastCalState = c.state; showPreset(); }
}

async function showPreset() {
  const p = (await api("/api/preset")).data;
  if (!p.signals) { $("preset").innerHTML = '<p class="small">нет сохраненного персета</p>'; plot($("calplot")); return; }
  $("preset").innerHTML = `<p class="small">Пресет от ${new Date(p.created).toLocaleString("ru-RU")}, скан ${p.scan.start_hz / 1e6}–${p.scan.stop_hz / 1e6} МГц,
    шаг ${p.scan.step_hz / 1e3} кГц; окно ±${p.params.window_hz / 1e6} МГц</p>
    <table><tr><th>№</th><th>Частота</th><th>Уровень</th><th>Фон</th></tr>${p.signals.map(x =>
    `<tr><td>${x.id}</td><td>${(x.freq_hz / 1e6).toFixed(3)} МГц</td><td>${x.level_dbm} дБм</td><td>${x.background_dbm} дБм</td></tr>`).join("")}</table>`;
  plot($("calplot"), p.scan.start_hz, p.scan.step_hz, p.spectrum, p.signals.map(x => x.freq_hz));
}

async function relay(ch, action) {
  const r = await api(`/api/relay/${ch}/${action}`, "POST");
  if (!r.ok) alert("Команда не выполнена: " + r.data.detail);
  refresh();
}
async function calibrate() {
  const r = await api("/api/calibration/start", "POST");
  if (!r.ok) alert(r.data.detail);
  refresh();
}
async function resetPreset() {
  await api("/api/preset", "DELETE");
  showPreset();
  refresh();
}
async function refreshLog() {
  const rows = (await api("/api/log?limit=60")).data;
  $("log").innerHTML = rows.map(r => `<tr class="${r.level === "info" ? "" : "error"}"><td>${new Date(r.ts * 1000).toLocaleString("ru-RU")}</td><td></td></tr>`).join("");
  [...$("log").rows].forEach((tr, i) => tr.cells[1].textContent = rows[i].text);   // textContent: текст из журнала не интерпретируется как HTML
}

buildChannels(); refresh(); refreshLog(); showPreset();
setInterval(refresh, 1500); setInterval(refreshLog, 3000);
</script>
</body>
</html>
